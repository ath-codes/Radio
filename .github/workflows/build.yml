name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o RadioLite.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: RadioLite
        run: gradle assembleDebug --no-daemon -PstationsUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/stations.json
      - uses: actions/upload-artifact@v4
        with:
          name: RadioLite-debug
          path: RadioLite/app/build/outputs/apk/debug/*.apk
