name: Check links
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_links.py | tee links-report.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: links-report, path: links-report.txt }
